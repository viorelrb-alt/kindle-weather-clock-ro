# Meteo Alarm Kindle settings (sourced by bin/meteoalarmkindle.sh; keep UNIX line endings)

# Location for the forecast (decimal degrees) and the label shown on screen.
LATITUDE=44.2058
LONGITUDE=27.3306
PLACE="Călărași"

# Clock timezone as a POSIX TZ string (the Kindle has no zoneinfo database, so names like
# "Europe/Berlin" silently fall back to UTC). The Kindle's own timezone setting is ignored.
#   Japan JST-9            China CST-8              India IST-5:30
#   Sydney AEST-10AEDT,M10.1.0,M4.1.0/3             Central Europe CET-1CEST,M3.5.0,M10.5.0/3
#   UK GMT0BST,M3.5.0/1,M10.5.0                     US Eastern EST5EDT,M3.2.0,M11.1.0
#   US Pacific PST8PDT,M3.2.0,M11.1.0
TZ_POSIX="EET-2EEST,M3.5.0/3,M10.5.0/4"
# The same zone as an IANA name; Open-Meteo uses it to line up hourly forecasts.
TZ_IANA="Europe/Bucharest"

# Fetch weather every N minutes (Open-Meteo's current data updates every 15 min).
WEATHER_MINUTES=15
# At night (NIGHT_START to NIGHT_END) fetch only every N minutes.
NIGHT_WEATHER_MINUTES=60

# Night hours (0-23): fewer weather fetches, and the automatic light switches off.
NIGHT_START=23
NIGHT_END=6

# Hours of precipitation forecast to check, starting with the current hour. When any of them is
# wet, the simple view shows the precipitation box with an hourly chart (rain or snow).
RAIN_LOOKAHEAD_HOURS=12
# An hour counts as rainy when its precipitation probability reaches this (%),
# or its forecast precipitation is at least 0.1 mm.
RAIN_PROBABILITY=50

# Between these, each minute repaints only the clock (and the status bar when it changes).
# Every N minutes the whole screen is redrawn with a flash to clear e-ink ghosting.
FULL_REFRESH_MINUTES=15

# Resync the system clock against this NTP server once an hour.
NTP_SERVER="ro.pool.ntp.org"

# Light panel: the frontlight steps (0-24) behind the presets (LIGHT_2 Mediu, LIGHT_3 Maxim;
# LIGHT_1 is the old "Slab", still used by EVENING_LIGHT=2). − and + move one step of 24.
LIGHT_1=4
LIGHT_2=10
LIGHT_3=24

# Sky icon from the cloud cover (%) instead of the model code.
# 0 = model code only, 1 = total cloud cover, 2 = low + mid clouds only (high cirrus ignored).
CLOUD_REFINE=2

# With CLOUD_REFINE=2: low clouds at or above this % always show "overcast".
LOW_OVERCAST=35

# Open-Meteo weather model. Empty = their automatic choice (best_match).
# Try: icon_seamless (DWD, Germany), ecmwf_ifs025 (ECMWF), gfs_seamless (NOAA, USA).
# Models with fewer than 6 forecast days (e.g. meteofrance_seamless) leave the last day empty.
MODEL="icon_seamless"

# Automatic light: off at night; from sunset, EVENING_LIGHT (0 Oprit, 1 Minim, 2 Slab, 3 Mediu, 4 Maxim),
# or off while the battery is under BATT_LOW % and not charging. A manual pick stays until the
# next change (sunset, NIGHT_START, low battery). 0 = never change the light automatically.
AUTO_LIGHT=1
EVENING_LIGHT=3

# Under this battery % (not charging) the status bar asks, in bold, for the charger.
BATT_LOW=25

# "Resimțit 17°" and "Vânt 14 km/h" lines. 0 = hide them.
SHOW_FEELS=1

# Light swipe: on the left edge (this wide, in screen pixels), slide up to brighten and down
# to dim until off, like a Kobo. A column of gray dots in the margin marks the zone. 0 = off.
LIGHT_SWIPE=1
SWIPE_W=60

# Weather warnings (yellow/orange/red) from MeteoAlarm: up to two codes at the top of the screen,
# or "FĂRĂ AVERTIZĂRI METEO". The county is taken from cities.txt; WARN_AREA="Brăila" forces
# one. Checked every WARN_MINUTES. 0 = off.
WARNINGS=1
WARN_AREA=""
WARN_MINUTES=30
WARN_FEED="feeds.meteoalarm.org/feeds/meteoalarm-legacy-atom-romania"

# Pollen (Open-Meteo air quality, Europe, in season) for the landscape simple view, checked every
# POLLEN_MINUTES. 0 = off.
POLLEN=1
POLLEN_MINUTES=60

# The menu (☰) closes by itself after this many seconds without a tap.
MENU_SECONDS=15

# Light pop-up (light button: the bar on the left edge and the bubble): it closes after this
# many seconds without a swipe on the bar, or at once from the light button or a tap elsewhere.
LIGHT_SECONDS=10

# 1: a tap outside an open menu (☰, light pop-up, city picker) closes it at once.
# 0: taps outside are ignored; the menus close by themselves or from "Închide".
CLOSE_OUTSIDE=1
